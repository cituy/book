<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
<script>
(async function () {
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      id: params.get("id"),
      list: params.get("list"),
      previous: params.get("previous"),
      next: params.get("next"),
      category: params.get("category")
    };
  }

  // কোনো route না থাকলে redirect
  const params = getParams();
  const hasAnyRoute = params.id || params.list !== null || params.previous !== null || params.next !== null || params.category;
  if (!hasAnyRoute) {
    location.replace("https://muluot.com");
    return;
  }

  // pure raw JSON output (no UI)
  function sendJSON(data) {
    document.open();
    document.write(JSON.stringify(data));
    document.close();
  }

  function error(msg, code) {
    sendJSON({ error: true, message: msg, code: code || 400 });
  }

  try {
    const res = await fetch("/list.json", { cache: "no-store" });
    if (!res.ok) throw new Error("list.json fetch failed: " + res.status);
    const json = await res.json();

    if (!json.fields || !Array.isArray(json.data)) {
      throw new Error("Invalid list.json format");
    }

    const fields = json.fields;
    const data = json.data;

    function idx(name) {
      return fields.indexOf(name);
    }

    const idIdx = idx("id");
    const uniqueidIdx = idx("uniqueid");
    const priceIdx = idx("price");
    const payableIdx = idx("payable");
    const categoryIdx = idx("category");

    // ========== ?id=605146 ==========
    if (params.id) {
      const searchId = String(params.id).trim();
      const found = data.find(row =>
        String(row[uniqueidIdx]) === searchId ||
        String(row[idIdx]) === searchId
      );

      if (!found) {
        return error("Book not found for id: " + searchId, 404);
      }

      return sendJSON({
        fields: fields,
        data: [found]
      });
    }

    // ========== ?list=20 ==========
    if (params.list !== null && params.list !== undefined) {
      const count = Math.max(1, parseInt(params.list, 10) || 20);

      const freeData = [];
      const premiumData = [];
      const byCategory = {};

      for (const row of data) {
        const payable = String(row[payableIdx] || "").toLowerCase();
        const cat = String(row[categoryIdx] || "অন্যান্য").trim() || "অন্যান্য";

        if (payable === "free" || payable === "0" || row[priceIdx] === "0" || row[priceIdx] === 0) {
          if (freeData.length < count) freeData.push(row);
        } else {
          if (premiumData.length < count) premiumData.push(row);
        }

        if (!byCategory[cat]) byCategory[cat] = [];
        if (byCategory[cat].length < count) {
          byCategory[cat].push(row);
        }
      }

      const categories = {};
      for (const cat in byCategory) {
        categories[cat] = {
          fields: fields,
          data: byCategory[cat]
        };
      }

      return sendJSON({
        free: {
          fields: fields,
          data: freeData
        },
        premium: {
          fields: fields,
          data: premiumData
        },
        categories: categories
      });
    }

    // ========== ?previous=20&next=20&category=... ==========
    if (params.next !== null || params.previous !== null || params.category) {
      let offset = 0;
      let take = 20;
      let categoryFilter = (params.category || "both").toLowerCase().trim();

      if (params.previous !== null && params.previous !== "") {
        offset = Math.max(0, parseInt(params.previous, 10) || 0);
      }
      if (params.next !== null && params.next !== "") {
        take = Math.max(1, parseInt(params.next, 10) || 20);
      }

      let filtered = data;

      if (categoryFilter === "free") {
        filtered = data.filter(row => {
          const payable = String(row[payableIdx] || "").toLowerCase();
          return payable === "free" || payable === "0" || row[priceIdx] === "0" || row[priceIdx] === 0;
        });
      } else if (categoryFilter === "paid" || categoryFilter === "premium") {
        filtered = data.filter(row => {
          const payable = String(row[payableIdx] || "").toLowerCase();
          return payable !== "free" && payable !== "0" && row[priceIdx] !== "0" && row[priceIdx] !== 0;
        });
      } else if (categoryFilter !== "both" && categoryFilter !== "all" && categoryFilter !== "") {
        filtered = data.filter(row => {
          const cat = String(row[categoryIdx] || "").toLowerCase();
          return cat === categoryFilter || cat.includes(categoryFilter);
        });
      }

      const page = filtered.slice(offset, offset + take);

      return sendJSON({
        fields: fields,
        data: page
      });
    }

    // fallback
    sendJSON({ fields: fields, data: [] });

  } catch (err) {
    error(err.message || "Unknown error", 500);
  }
})();
</script>
</body>
</html>
